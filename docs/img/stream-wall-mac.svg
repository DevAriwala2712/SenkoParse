<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" role="img" aria-labelledby="t d"><title id="t">Wall time on an M3 Pro, DuckDB 1.4.5</title><desc id="d">Line chart. On an Apple M3 Pro with DuckDB 1.4.5, SenkoParse takes 0.25 and 1.25 seconds at 0.4 and 1.9 GB; DuckDB piped 1.06 and 4.83; DuckDB by filename 0.49 and 2.13.</desc><rect x="0.5" y="0.5" width="819" height="399" rx="10" fill="#fcfcfb" stroke="#e3e2dd"/><text x="24" y="32" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#0b0b0b">Wall time on an M3 Pro, DuckDB 1.4.5</text><text x="24" y="50" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#52514e">Seconds, min of 2, 1 thread. qe vs DuckDB piped: 4.2x at 0.4 GB, 3.9x at 1.9 GB. One query.</text><line x1="74" x2="610" y1="338.0" y2="338.0" stroke="#e3e2dd"/><text x="66" y="342.0" text-anchor="end" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#52514e">0</text><line x1="74" x2="610" y1="250.7" y2="250.7" stroke="#e3e2dd"/><text x="66" y="254.7" text-anchor="end" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#52514e">2</text><line x1="74" x2="610" y1="163.3" y2="163.3" stroke="#e3e2dd"/><text x="66" y="167.3" text-anchor="end" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#52514e">4</text><line x1="74" x2="610" y1="76.0" y2="76.0" stroke="#e3e2dd"/><text x="66" y="80.0" text-anchor="end" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#52514e">6</text><line x1="181.3" x2="181.3" y1="338" y2="343" stroke="#52514e"/><text x="181.3" y="358" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#52514e">0.4 GB</text><line x1="610.0" x2="610.0" y1="338" y2